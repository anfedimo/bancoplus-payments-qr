# SLO del servicio payments-qr · declarado por el equipo dueño (you build it, you run it).
# La plataforma lo convierte en reglas de grabación, alertas multiventana y el gate de Error Budget.
# Cambios vía PR en este repositorio con aprobación de la tribu y de Plataforma de Confiabilidad.

service: payments-qr
journey: pago-qr
owner: tribu-pagos

# Span de servidor de la transacción (métricas RED de span_metrics, después de la normalización de negocio)
selector:
  service_name: payments-qr
  span_kind: SPAN_KIND_SERVER
  span_name: POST /payments/qr

slis:
  availability:
    # Pagos sin falla técnica según el estado normalizado en el Gateway (no el código HTTP):
    # business.outcome=declined fuera del SLI aunque se exponga como 5xx;
    # business.outcome=failed dentro del SLI aunque se exponga como 2xx.
    objective: 99.95
  latency:
    # Pagos completados por debajo del umbral, medido en el Gateway sobre el 100% del tráfico.
    objective: 99.0
    threshold_ms: 800

# Error Budget Policy
policy:
  budget_exhausted: block
  fast_burn: block
  slow_burn: warn
  no_data: block            # fail-closed: sin telemetría no hay despliegue
  min_requests: 100
  # Significancia estadística del budget: a 99.95% se requieren ≥ 20k eventos (≥ 10 fallas permitidas).
  # Por debajo, solo aplican los checks de burn rate.
  min_budget_requests: 20000

profiles:
  prod:
    budget_window: 30d
    fast_burn: {long: 1h, short: 5m, threshold: 14.4}     # 2% del budget en 1h
    slow_burn: {long: 6h, short: 30m, threshold: 6}       # 5% del budget en 6h
    canary: {window: 10m, threshold: 14.4, duration_s: 1800, interval_s: 60, min_requests: 500}
  poc:
    # Ventanas comprimidas para validación local
    budget_window: 30m
    fast_burn: {long: 5m, short: 1m, threshold: 14.4}
    slow_burn: {long: 15m, short: 3m, threshold: 6}
    canary: {window: 1m, threshold: 14.4, duration_s: 180, interval_s: 30, min_requests: 50}
